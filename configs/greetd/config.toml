# /etc/greetd/config.toml — greetd + tuigreet login for the Caelestia rice.
# Installed by ./setup-greetd.sh (root); see README.

[terminal]
# greetd owns this VT. 7 is the safe choice on Artix: gettys are configured
# for tty1–tty6, so nothing else competes for tty7. Do not use a VT that has
# a getty on it (tty1 used to fight greetd here).
vt = 7

[default_session]
# tuigreet launches Hyprland directly. greetd runs this through `/bin/sh -c`,
# so quote any argument that contains shell metacharacters.
command = "tuigreet --time --remember --asterisks --cmd start-hyprland"
user = "greeter"
